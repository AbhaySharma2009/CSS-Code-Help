<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- font family  -->
    <h1 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">My name is abhay pratap sharma</h1>

    <!-- font weight=how thick or bold the text look  -->
    <h2 style="font-weight: 900;">My name is abhay pratap sharma</h2>

    <!-- font style=how the text look -->
    <h3 style="font-style: italic;">My name is abhay pratap sharma</h3>

    
    <!-- <em>=italic letter -->
    <h4><em>my name is abhay pratap sharma</em></h4>

    <!-- strong=bold the letters -->
    <p><strong>My name is abhay pratap sharma</strong></p>

    

</body>
</html>
