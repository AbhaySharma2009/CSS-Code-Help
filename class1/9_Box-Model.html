<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width:auto;
            text-align: center;
            margin:30px;
            border: 30px solid black;
            padding-top: 50px;
        }
        #orange{
            background-color: orange;
        }
        #white{
            background-color: white;
        }
        #green{
            background-color: green;
        }

    </style>
</head>
<body>
    <div class="box" id="orange">Abhay</div>
    <div class="box" id="white">Pratap</div>
    <div class="box" id="green">Sharma</div>
</body>
</html>
